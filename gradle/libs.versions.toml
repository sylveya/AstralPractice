[versions]

# plugins & build tools
shadow = "9.6.1"
spotless = "8.10.4"
anvil = "1.0.0"
checkstyle = "14.3.0"
google-java-format = "1.36.1"

# compile time processing
lombok = "1.18.48"

# platform api
paper = "26.2.build.129-stable"

# dependencies
packetevents = "2.14.0"
placeholderapi = "2.12.3"
tab-api = "6.1.2"
fastasyncworldedit = "2.15.3"
configura = "2.1.0"
strata = "2.0.0"
anvilgui = "1.10.13-SNAPSHOT"
bstats = "3.2.1"
faststats = "0.30.2"
gson = "2.14.0"
hikaricp = "7.1.0"
mariadb = "3.5.10"
scoreboard-library = "2.8.3"

# testing
junit = "6.1.3"
snakeyaml = "2.4"

[libraries]

# compile time processing
lombok = { group = "org.projectlombok", name = "lombok", version.ref = "lombok" }

# build plugins for build-logic
shadow-plugin = { group = "com.gradleup.shadow", name = "shadow-gradle-plugin", version.ref = "shadow" }
spotless-plugin = { group = "com.diffplug.spotless", name = "spotless-plugin-gradle", version.ref = "spotless" }

# platform api
paper-api = { group = "io.papermc.paper", name = "paper-api", version.ref = "paper" }

# core dependencies
packetevents-spigot = { group = "com.github.retrooper", name = "packetevents-spigot", version.ref = "packetevents" }
placeholderapi = { group = "maven.modrinth", name = "placeholderapi", version.ref = "placeholderapi" }
tab-api = { group = "com.github.NEZNAMY", name = "TAB-API", version.ref = "tab-api" }
fawe-core = { group = "com.fastasyncworldedit", name = "FastAsyncWorldEdit-Core", version.ref = "fastasyncworldedit" }
fawe-bukkit = { group = "com.fastasyncworldedit", name = "FastAsyncWorldEdit-Bukkit", version.ref = "fastasyncworldedit" }
configura = { group = "me.whereareiam", name = "configura", version.ref = "configura" }
configura-feature-comment = { group = "me.whereareiam.configura.feature", name = "comment", version.ref = "configura" }
strata = { group = "me.whereareiam", name = "strata", version.ref = "strata" }
strata-adapter-configura = { group = "me.whereareiam", name = "strata-adapter-configura", version.ref = "strata" }
anvilgui = { group = "net.wesjd", name = "anvilgui", version.ref = "anvilgui" }
bstats-bukkit = { group = "org.bstats", name = "bstats-bukkit", version.ref = "bstats" }
faststats-bukkit = { group = "dev.faststats.metrics", name = "bukkit", version.ref = "faststats" }
gson = { group = "com.google.code.gson", name = "gson", version.ref = "gson" }
hikaricp = { group = "com.zaxxer", name = "HikariCP", version.ref = "hikaricp" }
mariadb = { group = "org.mariadb.jdbc", name = "mariadb-java-client", version.ref = "mariadb" }
scoreboard-library-api = { group = "net.megavex", name = "scoreboard-library-api", version.ref = "scoreboard-library" }
scoreboard-library-implementation = { group = "net.megavex", name = "scoreboard-library-implementation", version.ref = "scoreboard-library" }

# testing & anvil
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }
anvil-protocol-mcprotocol = { group = "me.whereareiam.anvil", name = "protocol-mcprotocol", version.ref = "anvil" }

[bundles]

configura = ["configura", "configura-feature-comment"]
strata = ["strata", "strata-adapter-configura"]
scoreboard = ["scoreboard-library-api", "scoreboard-library-implementation"]

[plugins]

shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
anvil = { id = "me.whereareiam.anvil", version.ref = "anvil" }
anvil-junit = { id = "me.whereareiam.anvil.junit", version.ref = "anvil" }
anvil-capability-default = { id = "me.whereareiam.anvil.capability.default", version.ref = "anvil" }
anvil-platform-paper = { id = "me.whereareiam.anvil.platform.paper", version.ref = "anvil" }
