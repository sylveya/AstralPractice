name: AstralPractice
version: '${version}'
main: dev.lokspel.practice.AstralPractice
authors: [ lokspel ]
softdepend: [ PlaceholderAPI, Multiverse-Core, FastAsyncWorldEdit, My_Worlds, TAB ]
loadbefore: [ CMI, CMILib ]
api-version: 1.13
commands:
  arena:
    description: Arena command
  ladder:
    description: Ladder command
  setup:
    description: Setup command
  duel:
    description: Duel command
  accept:
    description: Duel accept command
  settings:
    description: Settings command
  practice:
    aliases: [prac, astralpractice, astralprac, astralp]
  staff:
    aliases: staffmode
  spectate:
    aliases: spec
  party:
    aliases: p
  matchinv:
    description: Match inventory command.
  event:
    aliases: e
  statistics:
    aliases: [stat, stats]
  preview:
    description: Preview the kit for the ladders.
  divisions:
    description: View all the divisions.
  unranked:
    description: Opens the unranked queue GUI.
  ranked:
    description: Opens the ranked queue GUI.
  editor:
    description: Opens the ladder editor selector GUI.
  ffa:
    description: FFA command.
  copykit:
    description: Copy a custom kit from another player.
  ignorequeue:
    description: Ignore a player in unranked queue.
  cosmetics:
    aliases: [cosmetc, csmetic]
    description: Open the cosmetics GUI for armor trim customization.
  customqueue:
    aliases: [cqueue, customkitqueue]
    description: Queue for custom-kit matchmaking commands.
  matchhistory:
    aliases: [mh, matchhist]
    description: View match history for a player.
  nick:
    aliases: [nickname]
    description: Change your formatted display name.

permissions:
  ap.admin:
    default: op
    children:
      ap.setup: true
      ap.staff: true
      ap.event.*: true
      ap.settings.*: true
      ap.admin.scoreboard: true
  ap.setup:
    description: Setup everything.
    children:
      ap.ladder.freeze: true
      ap.arena.freeze: true
  ap.staff:
    description: Staff permission.
    children:
      ap.staffmode: true
      ap.staffmode.fly: true
      ap.staffmode.stop: true
      ap.staffmode.see: true
      ap.staffmode.chat: true
      ap.bypass.privatemessage: true
      ap.bypass.spectate: true
  ap.autosave.alert:
    description: Alerts when the auto save ends and starts.

  # Practice command permissions
  ap.practice.*:
    children:
      ap.practice.lobby: true
      ap.practice.arenas: true
      ap.practice.info: true
      ap.practice.info.teleport: true
      ap.practice.info.cancel: true
      ap.practice.info.resetstats: true
      ap.practice.elo.default: true
      ap.practice.elo.specific: true
      ap.practice.ranked: true
      ap.practice.unranked: true
      ap.practice.exp: true
      ap.practice.rename: true
      ap.practice.preset: true
      ap.practice.reload: true
      ap.practice.stop: true
  ap.practice.lobby:
    description: Teleport to and set the lobby.
  ap.practice.arenas:
    description: Teleport to the arenas world.
  ap.practice.info:
    description: Usage for the /prac info <player> command.
  ap.practice.info.teleport:
    description: Teleport to the player's activities.
  ap.practice.info.cancel:
    description: Cancel the player's activities.
  ap.practice.info.resetstats:
    description: Reset the player's statistics.

  ap.practice.elo.default:
    description: Reset the player's elos to default.
  ap.practice.elo.specific:
    description: Set the player's elos to a specific number.

  ap.practice.rename:
    description: Usage for the /prac rename command.
  ap.practice.preset:
    description: Usage for the /prac preset add command.
  ap.practice.reset:
    description: Reset a player fully.
  ap.practice.reload:
    description: Reload practice config files.

  ap.practice.nametag.set:
    description: Set player's nametag.
  ap.practice.nametag.reset:
    description: Reset player's nametag.
  ap.practice.nametag.name.others:
    description: Allow changing other players' name format through /practice nametag name.
    default: op

  ap.nick.use:
    description: Use /nick command.
    default: true
  ap.nick.others:
    description: Set another player's display name using /nick.
    default: op
    children:
      ap.nick.use: true
  ap.nick.different-name:
    description: Allow /nick to use a different visible username instead of only styling the real one.
    default: op
    children:
      ap.nick.use: true
  ap.nick.reset.others:
    description: Reset another player's display name using /nick reset.
    default: op
    children:
      ap.nick.use: true

  ap.practice.unranked.default:
    description: Reset the player's daily unranked limit to default.
  ap.practice.unranked.add:
    description: Add extra unranked to a player.

  ap.practice.ranked.default:
    description: Reset the player's daily ranked limit to default.
  ap.practice.ranked.add:
    description: Add extra rankeds to a player.
  ap.practice.ranked.ban:
    description: Ban a player from playing ranked matches.
  ap.practice.ranked.unban:
    description: Unban a player from playing ranked matches.

  ap.practice.exp.reset:
    description: Reset the player's experience.
  ap.practice.exp.add:
    description: Add experience to a player.
  ap.practice.exp.set:
    description: Set experience to a player.



  # Player settings
  ap.settings.*:
    children:
      ap.settings.open: true
      ap.bypass.cooldown: false
      ap.settings.duelrequest: true
      ap.settings.autoqueue: true
      ap.settings.scoreboard: true
      ap.settings.privatemessage: true
      ap.settings.partyinvite: true
      ap.settings.playerhide: true
      ap.settings.allowspectate: true
      ap.settings.worldtime: true
      ap.settings.prefixvisibility: true
  ap.settings.open:
    description: Open the settings gui.
    default: true
  ap.settings.duelrequest:
    description: Toggle duel requests.
  ap.settings.autoqueue:
    description: Toggle auto-queue after a match ends.
  ap.settings.scoreboard:
    description: Toggle the scoreboard.
  ap.settings.privatemessage:
    description: Toggle private messages.
  ap.settings.partyinvite:
    description: Toggle party invites.
  ap.settings.playerhide:
    description: Toggle player hider in lobby.
  ap.settings.allowspectate:
    description: Toggle spectators in their matches.
  ap.settings.worldtime:
    description: Change world time.
  ap.settings.prefixvisibility:
    description: Change prefix/suffix visibility mode in chat/tab/sidebar/nametag.
  ap.settings.fly:
    description: Toggle fly in the lobby.

  # Staff mode
  ap.staffmode:
    description: Turn on staff mode.
    children:
      ap.bypass.spectate: true
  ap.staffmode.fly:
    description: Fly in the lobby.
  ap.staffmode.forceend:
    description: Able to force end matches (if possible party matches can continue) and freezes the player in the lobby.
  ap.staffmode.chat:
    description: Use staff chat.
  ap.staffmode.see:
    description: See the hiding staffs.

  ap.ladder.freeze:
    description: Freeze ladders so player can't start a new game with it.
  ap.ladder.stop:
    description: Stop all the matches with a ladder.
  ap.arena.freeze:
    description: Freeze arenas so player can't start a new game with it.
  ap.arena.stop:
    description: Stop all the matches in a arena.

  # Basic permission
  ap.spectate:
    default: true
  ap.spectate.vanish:
    description: Toogle vanish when spectating.
  ap.spectate.menu:
    description: Spectate menu use.
  ap.spectate.random:
    description: Spectate random match.
  ap.spectate.targets:
    description: Open the fighter list and teleport to a single fighter while spectating.
  ap.statistics:
    default: true
  ap.statistics.other:
    description: View other players statistics.
  ap.divisions.view:
    default: true
    description: Open the divisions GUI.

  ap.ignorequeue:
    default: true
    description: Ignore a player in unranked queue.

  ap.queue.multi:
    description: Allows players to queue for multiple ladders in the same queue type.

  ap.duel:
    description: Use the /duel command.
  ap.duel.selectarena:
    description: Player can choose the arena to play in.
  ap.duel.selectrounds:
    description: Player can choose how many rounds they want to play.

  ap.duel.infiniteinvite:
    description: Player can invite player to duel any number of times.
  ap.party.selectarena:
    description: Choose arena to play in with party.
  ap.party.selectrounds:
    description: Player can choose how many rounds they want to play.
  ap.party.infiniteinvite:
    description: Party leader can invite other parties any number of times. (Before the previous invite expire)

  # Party permissions
  ap.party.create:
    description: Create party.
  ap.party.info.others:
    description: View other player's party information.
  ap.party.changelimit:
    description: Change party player limit.
  ap.party.public:
    description: Change party status to public.
  ap.party.view:
    description: View public parties.
  ap.party.joinpublic:
    description: Join a public party without an invite.
  ap.party.broadcast:
    description: Broadcast the party, if it public.
  ap.party.allinvite:
    description: Invite all the players in the server to the party.
  ap.party.partychat:
    description: Change party chat use status.
  ap.party.duelrequest:
    description: Toggle duel requests in party.

  # Event permissions
  ap.event.*:
    children:
      ap.event.host.all: true
      ap.event.join: true
      ap.event.stop.collecting: true
      ap.event.stop.live: true
  ap.event.host:
    description: Open the event host gui.
  ap.event.host.all:
    description: Host all the events.
    children:
      ap.event.host: true
  ap.event.join:
    default: true

  ap.event.stop.collecting:
    description: Stop events while its collecting.
  ap.event.stop.live:
    description: Stop ongoing events.

  # Bypasses
  ap.bypass.privatemessage:
    description: Players with this permission can send private messages to players who don't accept them.
  ap.bypass.ranked.requirements:
    description: Bypass ranked requirements.
  ap.bypass.cooldown:
    description: Cooldown bypass for spectate vanish, lobby vanish etc..
  ap.bypass.unranked.limit:
    description: Bypass unranked limit per day.
  ap.bypass.ranked.limit:
    description: Bypass ranked limit per day.
  ap.bypass.party.broadcast.limit:
    description: Bypass the daily party broadcast limit.
  ap.bypass.elo.change:
    description: Players elo cannot be changed with commands.
  ap.bypass.forceend:
    description: Bypass staff forceend. (Can't end their match or event)
  ap.bypass.stop:
    description: Bypass staff stop. (Can't be removed from match or event)
  ap.bypass.nametag:
    description: Bypass nametag change.
  ap.bypass.spectate:
    description: Bypass if a match is not viewable.

  # Custom Kits
  ap.customkit.1:
    description: Create 1 custom kit.
  ap.customkit.2:
    children:
      ap.customkit.1: true
  ap.customkit.3:
    children:
      ap.customkit.2: true
  ap.customkit.4:
    children:
      ap.customkit.3: true

  # Custom player kit
  ap.playerkit.share:
    description: Share custom kit with others.
  ap.playerkit.copy:
    description: Copy custom kit from others.
  ap.playerkit.queue.host:
    description: Host a custom kit queue.
  ap.playerkit.queue.use:
    description: Use custom kit queue commands.
    default: true

  # Cosmetics
  ap.cosmetics.main:
    description: Open the cosmetics GUI.
  ap.cosmetics.armortrim.base.*:
    description: Allow access to all armor base tiers.
    children:
      ap.cosmetics.armortrim.base.leather: true
      ap.cosmetics.armortrim.base.gold: true
      ap.cosmetics.armortrim.base.iron: true
      ap.cosmetics.armortrim.base.diamond: true
      ap.cosmetics.armortrim.base.netherite: true
  ap.cosmetics.armortrim.base.leather:
    description: Allow access to Leather armor tier.
  ap.cosmetics.armortrim.base.gold:
    description: Allow access to Gold armor tier.
  ap.cosmetics.armortrim.base.iron:
    description: Allow access to Iron armor tier.
  ap.cosmetics.armortrim.base.diamond:
    description: Allow access to Diamond armor tier.
  ap.cosmetics.armortrim.base.netherite:
    description: Allow access to Netherite armor tier.
  ap.cosmetics.armortrim.apply-global:
    description: Copy armor trim setting to all armor types.
  ap.cosmetics.lobby.*:
    description: Access all lobby movement cosmetics.
    children:
      ap.cosmetics.lobby.none: true
      ap.cosmetics.lobby.wind_charge: true
      ap.cosmetics.lobby.trident: true
      ap.cosmetics.lobby.spear: true
      ap.cosmetics.lobby.elytra: true
  ap.cosmetics.lobby.none:
    description: Select no lobby movement cosmetic.
  ap.cosmetics.lobby.wind_charge:
    description: Select the lobby wind charge cosmetic.
  ap.cosmetics.lobby.trident:
    description: Select the lobby trident cosmetic.
  ap.cosmetics.lobby.spear:
    description: Select the lobby spear cosmetic.
  ap.cosmetics.lobby.elytra:
    description: Select the lobby elytra cosmetic.

  # Note: ap.cosmetics.pattern.*, ap.cosmetics.material.*, and cosmetic preset
  # permissions (ap.cosmetics.preset.*, ap.cosmetics.preset.trim.<id>,
  # ap.cosmetics.preset.shield.<id>) are dynamically registered at runtime
  # based on the server's Minecraft version and cosmetic-presets.yml.
  # They do NOT need to be declared here.

  # Match History
  ap.matchhistory:
    description: Access /matchhistory command.
    default: op
